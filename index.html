<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel='stylesheet' type = 'text/css' href='mainstyle.css'>
    <title>Ben Samara Skill Tree</title>
    <script src="treeDatabase.js"></script>
    <script src="main.js" defer></script>
</head>
<body>

    <header>
    </header>

    <div class="carousel-wrapper">
        <div id="tree-arts" class="talent-tree-container">
            <svg class="talent-lines" id = "svg-canvas" xmlns="http://www.w3.org/2000/svg">

                <defs>
                    <!-- markerWidth/Height="24" scales with a 12px thick line -->
                    <!-- refX="0" anchors the flat base of the arrow to the end of the line -->
                    <marker id="arrow"
                            markerWidth="24"
                            markerHeight="24"
                            viewBox="0 0 10 10"
                            refX="0"
                            refY="5"
                            orient="auto"
                            markerUnits="userSpaceOnUse">
                        <polygon points="0 0, 6 5, 0 10" fill="#FFD700" />
                    </marker>
                </defs>

            </svg>
        </div>
    </div>

    <div id="global-tooltip" class="wow-tooltip">
        <div class="tooltip-title"></div>
        <div class="tooltip-type"></div>
        <div class="tooltip-req"></div>
        <div class="tooltip-desc"></div>
        <div class="tooltip-green"></div>
    </div>

    <footer>
        <nav>

        </nav>
    </footer>

</body>
</html>
