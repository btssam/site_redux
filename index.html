<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel='stylesheet' type = 'text/css' href='mainstyle.css'>
    <title>Ben Samara Skill Tree</title>
    <script src="treeDatabase.js"></script>
    <script src="main.js" defer></script>
</head>

<body class="preload">
<!--    global svg definitions, for the lines-->
    <svg xmlns="http://www.w3.org/2000/svg" style="height: 0; width: 0; position: absolute;">
        <defs>
            <marker id="arrow" markerWidth="24" markerHeight="24" viewBox="0 0 10 10"
                    refX="0" refY="5" orient="auto" markerUnits="userSpaceOnUse">
                <polygon points="0 0, 6 5, 0 10" fill="#FFD700" />
            </marker>
        </defs>
    </svg>

    <header class="top-title-bar">
        <h1>Skills</h1>
    </header>

<!--intending to make this take up the whole screen to start-->
    <main class="tree-page-wrapper">

    <!--Arts-->
        <section class="carousel-wrapper">
            <div id="tree-arts" class="talent-tree-container pos-left">
                <svg class="talent-lines"></svg>
            </div>
    <!--Games-->
            <div id="tree-games" class="talent-tree-container pos-center">
                <svg class="talent-lines"></svg>
            </div>
    <!--Computers-->
            <div id="tree-computers" class="talent-tree-container pos-right">
                <svg class="talent-lines"></svg>
            </div>
        </section>

        <nav class="bottom-nav">
            <div class="nav-title">
                <h1>Skill Trees</h1>
            </div>
            <ul class="nav-links">
                <li><a href="#about">About</a></li>
                <li><a href="#portfolio">Portfolio</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
        </nav>

    </main>

    <div id="global-tooltip" class="wow-tooltip">
        <div class="tooltip-title"></div>
        <div class="tooltip-type"></div>
        <div class="tooltip-req"></div>
        <div class="tooltip-desc"></div>
        <div class="tooltip-green"></div>
    </div>

<!--    placeholder for extra content after the skilltree-->
    <section class="about" style="padding: 40px; text-align: center;">
        <h2>About</h2>
        <p>Hey this is about me!</p>
    </section>


    <footer>
        <nav>

        </nav>
    </footer>

</body>
</html>
