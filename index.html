<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel='stylesheet' type = 'text/css' href='mainstyle.css'>
    <title>Ben Samara Skill Tree</title>
    <script src="main.js" defer></script>
</head>
<body>

    <header>
    </header>


    <div class="talent-tree-container">
        
        <svg class="talent-lines" id = "svg-canvas" xmlns="http://www.w3.org/2000/svg">

            <defs>
                <!-- markerWidth/Height="24" scales with a 12px thick line -->
                <!-- refX="0" anchors the flat base of the arrow to the end of the line -->
                <marker class="arrow" id="arrow" 
                        markerWidth="24" 
                        markerHeight="24" 
                        viewBox="0 0 10 10" 
                        refX="0" 
                        refY="5" 
                        orient="auto" 
                        markerUnits="userSpaceOnUse">
                    <polygon points="0 0, 6 5, 0 10" fill="#FFD700" />
                </marker>
            </defs>

            <!-- test line to see arrow head -->
            <!-- <line x1="10%" y1="5%" x2="10%" y2="5%" 
            stroke="#FFD700" stroke-width="12" marker-end="url(#arrow)"/> -->

            <!-- x1,y1 is the start point. x2,y2 is the end point. -->
            <!-- <line x1="61.5%" y1="14%" x2="61.5%" y2="31%" 
            stroke="#FFD700" stroke-width="12" marker-end="url(#arrow)" /> -->

            <!-- right-angle line -->
            <!-- 'M' moves to start point. 'L' draws a line to the next point. -->
            <!-- <path d="M 456 100 L 570 100 L 570 160" 
            fill="none" stroke="#FFD700" stroke-width="12" marker-end="url(#arrow)" /> -->
            <!-- <path d="M 70% 14% L 49% 14% L 49% 24%" fill="none" stroke="#FFD700" stroke-width="12" /> -->

            <!-- <line x1="39%" y1="14%" x2="39%" y2="18%" 
            stroke="#FFD700" stroke-width="12" marker-end="url(#arrow)" /> -->

        </svg>
        
        <!-- Row 1 -->
        <div class="talent-node design-concepts"
            data-title="Design Concepts"
            data-type="Core Skill"
            data-req="Requires Brainstorming"
            data-desc="">
            Design<br>Concepts
            <span class ="skill-points full">5/5</span>
        </div>

        <div class="talent-node sketching">
            Sketching
            <span class ="skill-points full">5/5</span>
        </div>

        <!-- Row 2 -->
        <div class="talent-node audio">
            Audio
            <span class ="skill-points zero">0/5</span>
        </div>

        <div class="talent-node writing">
            Writing
            <span class ="skill-points partial">1/3</span>
        </div>

        <div class="talent-node figure-drawing">
            Figure<br>Drawing
            <span class ="skill-points partial">1/3</span>
        </div>

        <!-- Row 3 -->
        <div class="talent-node art-3d">
            3D
            <span class ="skill-points partial">1/3</span>
        </div>

        <div class="talent-node art-2d">
            2D
            <span class ="skill-points full">5/5</span>
        </div>

        <!-- Row 4 -->
        <div class="talent-node texture-uv">
            Texture<br>UV
            <span class ="skill-points partial">1/3</span>
        </div>

        <div class="talent-node raster">
            Raster
            <span class ="skill-points partial">1/3</span>
        </div>

        <div class="talent-node vector">
            Vector
            <span class ="skill-points partial">1/3</span>
        </div>

        <!-- Row 5 -->
        <div class="talent-node rigging">
            Rigging
            <span class ="skill-points partial">1/3</span>
        </div>

        <div class="talent-node anim-3d">
            3D Anim.
            <span class ="skill-points partial">1/3</span>
        </div>

        <div class="talent-node anim-2d">
            2D Anim.
            <span class ="skill-points partial">1/3</span>
        </div>

        <!-- Row 6 -->
        <div class="talent-node ui-ux">
            UI/UX<br>Design
            <span class ="skill-points partial">1/3</span>
        </div>

        <!-- Row 7 -->
        <div class="talent-node web-design">
            Web<br>Design
            <span class ="skill-points partial">1/3</span>
        </div>

    </div>

    <footer>
        <nav>

        </nav>
    </footer>


</body>
</html>
